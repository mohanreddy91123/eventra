version: '3.8'

services:
  # 1. MySQL 8.0 Database Service
  mysql:
    image: mysql:8.0
    container_name: eventra_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: eventra_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Backend API Service
  server:
    build:
      context: ./server
      dockerfile: ../Dockerfile.server
    container_name: eventra_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: eventra_db
      JWT_SECRET: eventra_super_secure_jwt_secret_key_2026_campus_platform
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"

  # 3. Frontend Web Service
  client:
    build:
      context: ./client
      dockerfile: ../Dockerfile.client
    container_name: eventra_frontend
    restart: always
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  mysql_data:
